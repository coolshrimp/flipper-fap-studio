name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the run in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows matches the extension's target platform: it ships the Windows STM32
    # emulator, and the desktop-runtime tests compile against the Windows toolchain.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Some tests and uFBT-related code paths need a Python interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm run test:simulator

      - name: Package extension
        run: npx vsce package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: flipper-fap-studio-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14
